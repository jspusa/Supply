<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supply workspace prototype</title>
  <!-- Three variants of the existing Supply workspace, switchable via ?variant=, with synthetic read-only data. -->
  <style>
    :root {
      color-scheme: light;
      --ink:#1d1d1f;
      --muted:#6e6e73;
      --line:rgba(29,29,31,.12);
      --soft:#f5f5f7;
      --surface:rgba(255,255,255,.82);
      --blue:#0071e3;
      --green:#138a53;
      --amber:#a15c00;
      --red:#b42318;
      --shadow:0 18px 60px rgba(0,0,0,.10);
    }
    * { box-sizing:border-box; }
    html { background:var(--soft); }
    body {
      margin:0;
      min-width:320px;
      color:var(--ink);
      background:
        radial-gradient(circle at 50% -10%, rgba(0,113,227,.12), transparent 34rem),
        var(--soft);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
    }
    button,input { font:inherit; }
    button { color:inherit; }
    .shell { min-height:100vh; padding-bottom:112px; }
    .glass {
      background:var(--surface);
      border:1px solid rgba(255,255,255,.78);
      box-shadow:0 1px 0 rgba(0,0,0,.04);
      backdrop-filter:saturate(180%) blur(22px);
      -webkit-backdrop-filter:saturate(180%) blur(22px);
    }
    .topbar {
      position:sticky;
      top:0;
      z-index:20;
      min-height:64px;
    }
    .brand { font-size:18px; font-weight:720; letter-spacing:-.02em; white-space:nowrap; }
    .eyebrow { color:var(--blue); font-size:12px; font-weight:720; letter-spacing:.08em; text-transform:uppercase; }
    .muted { color:var(--muted); }
    .nav-button,.group-button,.chip,.soft-button,.primary-button {
      border:0;
      border-radius:999px;
      cursor:pointer;
      min-height:38px;
      padding:0 15px;
      background:transparent;
      transition:background .16s ease,color .16s ease,transform .16s ease;
    }
    .nav-button:hover,.group-button:hover,.soft-button:hover { background:rgba(0,0,0,.055); }
    .nav-button:focus-visible,.group-button:focus-visible,.soft-button:focus-visible,.primary-button:focus-visible,.stepper button:focus-visible {
      outline:3px solid rgba(0,113,227,.30);
      outline-offset:2px;
    }
    .nav-button.active,.group-button.active { color:#fff; background:var(--ink); }
    .group-button { display:flex; align-items:center; gap:8px; }
    .count {
      display:inline-grid;
      place-items:center;
      min-width:22px;
      height:22px;
      padding:0 6px;
      border-radius:999px;
      background:rgba(0,0,0,.08);
      font-size:12px;
      font-weight:700;
    }
    .active .count { color:var(--ink); background:#fff; }
    .primary-button { color:#fff; background:var(--blue); font-weight:680; }
    .primary-button:hover { transform:translateY(-1px); background:#0077ed; }
    .soft-button { background:rgba(0,0,0,.055); }
    .metric-value { font-size:28px; font-weight:750; letter-spacing:-.04em; }
    .metric-label { margin-top:4px; color:var(--muted); font-size:13px; }
    .risk { color:var(--amber); background:#fff5e8; }
    .good { color:var(--green); background:#eaf8f0; }
    .neutral { color:#3f566c; background:#eef5fb; }
    .chip { min-height:28px; padding:0 10px; font-size:12px; font-weight:700; cursor:default; }
    .group-switch { display:flex; flex-wrap:wrap; gap:8px; }
    .table-frame { overflow:auto; max-height:410px; border:1px solid var(--line); border-radius:18px; background:#fff; }
    table { width:100%; min-width:840px; border-collapse:separate; border-spacing:0; }
    th {
      position:sticky;
      top:0;
      z-index:2;
      padding:12px 14px;
      color:var(--muted);
      background:#fbfbfd;
      border-bottom:1px solid var(--line);
      font-size:12px;
      text-align:left;
      white-space:nowrap;
    }
    td { padding:14px; border-bottom:1px solid rgba(29,29,31,.08); vertical-align:middle; }
    tr:last-child td { border-bottom:0; }
    .sku { font-weight:760; }
    .sku-sub { margin-top:4px; color:var(--muted); font-size:12px; }
    .quantity-stack { display:grid; gap:7px; min-width:112px; }
    .quantity-line { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .quantity-line span { color:var(--muted); font-size:11px; }
    .quantity-line strong { font-size:14px; }
    .stepper { display:grid; grid-template-columns:34px 54px 34px; align-items:center; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
    .stepper button { height:34px; border:0; background:#f5f5f7; cursor:pointer; font-size:18px; }
    .stepper input { width:54px; height:34px; border:0; text-align:center; font-weight:700; background:#fff; }
    .coverage strong { display:block; font-size:16px; }
    .coverage small { color:var(--muted); }
    .state-debug { margin-top:16px; color:var(--muted); font-size:12px; }
    .state-debug pre { overflow:auto; padding:12px; color:#d7f8d7; background:#18201a; border-radius:12px; }
    .prototype-switcher {
      position:fixed;
      left:50%;
      bottom:22px;
      z-index:50;
      display:grid;
      grid-template-columns:46px minmax(190px,auto) 46px;
      align-items:center;
      transform:translateX(-50%);
      color:#fff;
      background:rgba(20,20,22,.94);
      border:1px solid rgba(255,255,255,.18);
      border-radius:999px;
      box-shadow:0 14px 42px rgba(0,0,0,.30);
      backdrop-filter:blur(20px);
    }
    .prototype-switcher button { width:46px; height:46px; border:0; color:#fff; background:transparent; border-radius:50%; cursor:pointer; font-size:22px; }
    .prototype-switcher button:hover { background:rgba(255,255,255,.14); }
    .prototype-label { padding:0 12px; text-align:center; font-size:13px; font-weight:720; }
    .prototype-flag { position:fixed; right:18px; bottom:26px; z-index:40; color:var(--red); font-size:11px; font-weight:800; letter-spacing:.08em; }

    /* A — Focused workspace */
    .variant-a .topbar-inner { max-width:1160px; min-height:64px; margin:auto; padding:8px 22px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:22px; }
    .variant-a .top-actions { justify-self:end; }
    .variant-a .main-nav { display:flex; gap:4px; padding:4px; border-radius:999px; background:rgba(0,0,0,.045); }
    .variant-a main { max-width:1160px; margin:48px auto 0; padding:0 22px; }
    .variant-a .hero { display:flex; justify-content:space-between; align-items:flex-end; gap:24px; margin-bottom:24px; }
    .variant-a h1 { margin:4px 0 8px; font-size:46px; line-height:1; letter-spacing:-.055em; }
    .variant-a .summary-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px; }
    .variant-a .metric { min-height:112px; padding:20px; border-radius:20px; background:#fff; border:1px solid rgba(29,29,31,.08); }
    .variant-a .workspace-card { padding:22px; border-radius:28px; background:rgba(255,255,255,.92); box-shadow:var(--shadow); }
    .variant-a .workspace-head { display:flex; align-items:center; justify-content:space-between; gap:18px; margin-bottom:18px; }

    /* B — Mission control */
    .variant-b { background:#eef0f4; }
    .variant-b .topbar-inner { min-height:72px; padding:10px 30px; display:flex; align-items:center; gap:22px; }
    .variant-b .main-nav { display:flex; gap:2px; flex:1; }
    .variant-b .top-actions { margin-left:auto; }
    .variant-b main { max-width:1440px; margin:22px auto 0; padding:0 28px; }
    .variant-b .metric-band { display:grid; grid-template-columns:repeat(5,1fr); overflow:hidden; margin-bottom:18px; background:#1d1d1f; border-radius:20px; box-shadow:var(--shadow); }
    .variant-b .metric { min-height:94px; padding:20px; color:#fff; border-right:1px solid rgba(255,255,255,.13); }
    .variant-b .metric:last-child { border-right:0; }
    .variant-b .metric-label { color:rgba(255,255,255,.62); }
    .variant-b .control-line { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:14px; padding:12px 14px; background:#fff; border-radius:18px; }
    .variant-b .mission-grid { display:grid; grid-template-columns:minmax(220px,290px) 1fr; gap:16px; }
    .variant-b .queue { padding:14px; background:#fff; border-radius:20px; }
    .variant-b .queue-item { padding:14px; margin-bottom:8px; border-radius:14px; background:#f5f5f7; }
    .variant-b .queue-item.active { color:#fff; background:var(--blue); }
    .variant-b .workspace-card { min-width:0; padding:18px; background:#fff; border-radius:20px; }

    /* C — Guided flow */
    .variant-c { background:linear-gradient(145deg,#f7f2ea 0%,#eef5f4 60%,#eef4ff 100%); }
    .variant-c .topbar { background:transparent; border:0; backdrop-filter:none; }
    .variant-c .topbar-inner { max-width:1060px; min-height:78px; margin:auto; padding:12px 24px; display:flex; align-items:center; justify-content:space-between; }
    .variant-c .main-nav { display:none; }
    .variant-c main { max-width:1060px; margin:14px auto 0; padding:0 24px; }
    .variant-c .flow-title { max-width:740px; margin:42px auto 24px; text-align:center; }
    .variant-c h1 { margin:8px 0 10px; font-size:50px; line-height:1.02; letter-spacing:-.055em; }
    .variant-c .flow-steps { display:grid; grid-template-columns:repeat(5,1fr); gap:7px; margin:0 auto 24px; padding:7px; background:rgba(255,255,255,.70); border-radius:22px; box-shadow:0 10px 36px rgba(60,70,80,.09); }
    .variant-c .flow-step { padding:12px 8px; border-radius:16px; color:var(--muted); text-align:center; font-size:13px; font-weight:700; }
    .variant-c .flow-step.active { color:#fff; background:var(--ink); }
    .variant-c .workspace-card { padding:28px; background:rgba(255,255,255,.84); border:1px solid rgba(255,255,255,.85); border-radius:32px; box-shadow:0 26px 70px rgba(60,70,80,.13); backdrop-filter:blur(22px); }
    .variant-c .workspace-head { display:grid; grid-template-columns:1fr auto; align-items:center; gap:20px; margin-bottom:18px; }
    .variant-c .summary-inline { display:flex; gap:8px; margin-top:10px; }

    @media (max-width:900px) {
      .variant-a .topbar-inner,.variant-b .topbar-inner { grid-template-columns:1fr auto; flex-wrap:wrap; }
      .variant-a .main-nav,.variant-b .main-nav { order:3; grid-column:1 / -1; width:100%; overflow:auto; }
      .variant-a .summary-grid,.variant-b .metric-band { grid-template-columns:repeat(2,1fr); }
      .variant-b .mission-grid { grid-template-columns:1fr; }
      .variant-b .queue { display:flex; overflow:auto; }
      .variant-b .queue-item { min-width:180px; margin:0 8px 0 0; }
    }
    @media (max-width:620px) {
      .variant-a main,.variant-b main,.variant-c main { padding-left:14px; padding-right:14px; }
      .variant-a .hero { align-items:flex-start; flex-direction:column; }
      .variant-a h1,.variant-c h1 { font-size:38px; }
      .variant-a .summary-grid,.variant-b .metric-band { grid-template-columns:1fr 1fr; }
      .variant-c .flow-steps { grid-template-columns:repeat(5,110px); overflow:auto; }
      .prototype-flag { display:none; }
    }
    @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; transition:none!important; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="prototype-switcher" aria-label="Prototype variants">
    <button id="previousVariant" aria-label="上一個版本">←</button>
    <div class="prototype-label" id="variantLabel"></div>
    <button id="nextVariant" aria-label="下一個版本">→</button>
  </div>
  <div class="prototype-flag">PROTOTYPE · THROWAWAY</div>

  <script>
    const variants = [
      { key:'A', name:'專注工作區' },
      { key:'B', name:'營運控制台' },
      { key:'C', name:'引導式流程' },
    ];
    const state = {
      workspace:'訂單',
      orderGroup:'代工',
      groups:{ 台灣:3, 越南:8, 代工:2 },
      sources:{ H10:'已還原', JAM:'已還原', 美國庫存:'已還原' },
      velocityRisk:{ productSku:'GTP03', source:'0.36–18.39', planning:18.39, reasons:['重複速度相差超過 20%','曾出現零庫存'] },
      palletStep:1,
      coverageTarget:180,
      coverageMaximum:365,
    };

    function activeVariant() {
      const requested = new URLSearchParams(location.search).get('variant')?.toUpperCase();
      return variants.find(item => item.key === requested) || variants[0];
    }

    function navButtons(compact = false) {
      return `<nav class="main-nav" aria-label="主要工作區">${['今日','資料','建議','訂單','分析'].map(name => `
        <button class="nav-button ${state.workspace === name ? 'active' : ''}" data-workspace="${name}">${compact ? name.slice(0,2) : name}</button>`).join('')}</nav>`;
    }

    function groupButtons() {
      return `<div class="group-switch" aria-label="訂單群組">${Object.entries(state.groups).map(([name,count]) => `
        <button class="group-button ${state.orderGroup === name ? 'active' : ''}" data-group="${name}">${name}<span class="count">${count}</span></button>`).join('')}</div>`;
    }

    function orderTable() {
      return `<div class="table-frame"><table>
        <thead><tr><th>順序</th><th>品號</th><th>數量</th><th>棧板數</th><th>含舊訂單可售天數</th><th>新訂單到港後總可售天數</th><th>操作</th></tr></thead>
        <tbody>
          <tr>
            <td>⋮⋮ 1</td>
            <td><div class="sku">7ATGTP03</div><div class="sku-sub">產品品號 GTP03 · 已切換至代工</div></td>
            <td><div class="quantity-stack"><div class="quantity-line"><span>包</span><strong>3,360</strong></div><div class="quantity-line"><span>盒</span><strong>840</strong></div></div></td>
            <td><div class="stepper"><button aria-label="減少一板">−</button><input value="2" aria-label="棧板數"><button aria-label="增加一板">＋</button></div></td>
            <td class="coverage"><strong>96 天</strong><small>舊訂單先到港</small></td>
            <td class="coverage"><strong style="color:var(--green)">184 天</strong><small>健康 · 未超過 365</small></td>
            <td><button class="soft-button">切回原品號</button></td>
          </tr>
          <tr>
            <td>⋮⋮ 2</td>
            <td><div class="sku">7GTB03</div><div class="sku-sub">產品品號 GTB03 · 速度風險</div></td>
            <td><div class="quantity-stack"><div class="quantity-line"><span>包</span><strong>1,428</strong></div></div></td>
            <td><div class="stepper"><button aria-label="減少一板">−</button><input value="0.37" aria-label="棧板數"><button aria-label="增加一板">＋</button></div></td>
            <td class="coverage"><strong>32 天</strong><small>需要補貨</small></td>
            <td class="coverage"><strong style="color:var(--green)">180 天</strong><small>特殊小數板</small></td>
            <td><button class="soft-button">查看原因</button></td>
          </tr>
        </tbody>
      </table></div>`;
    }

    function statePanel(variant) {
      return `<details class="state-debug"><summary>原型狀態（每個版本使用相同資料）</summary><pre>${JSON.stringify({...state, variant:variant.key}, null, 2)}</pre></details>`;
    }

    function renderA(variant) {
      return `<div class="shell variant-a">
        <header class="topbar glass"><div class="topbar-inner"><div class="brand">Supply</div>${navButtons()}<div class="top-actions"><button class="primary-button">匯出 Excel</button></div></div></header>
        <main>
          <section class="hero"><div><div class="eyebrow">Order workspace</div><h1>訂單，不再混在一起。</h1><div class="muted">台灣、越南與同一家代工商，各自清楚，最後匯出同一份三工作表 Excel。</div></div><span class="chip good">所有輸入已自動還原</span></section>
          <section class="summary-grid">
            <div class="metric"><div class="metric-value">13</div><div class="metric-label">訂單品項</div></div>
            <div class="metric"><div class="metric-value">3</div><div class="metric-label">訂單群組</div></div>
            <div class="metric"><div class="metric-value">2</div><div class="metric-label">速度風險</div></div>
            <div class="metric"><div class="metric-value">180–365</div><div class="metric-label">健康覆蓋天數</div></div>
          </section>
          <section class="workspace-card"><div class="workspace-head"><div>${groupButtons()}<div class="muted" style="margin-top:10px">所有 7 開頭品號都在同一個代工區。</div></div><button class="soft-button">＋加入品項</button></div>${orderTable()}${statePanel(variant)}</section>
        </main>
      </div>`;
    }

    function renderB(variant) {
      return `<div class="shell variant-b">
        <header class="topbar glass"><div class="topbar-inner"><div class="brand">Supply · 營運控制台</div>${navButtons()}<div class="top-actions"><button class="primary-button">匯出三工作表</button></div></div></header>
        <main>
          <section class="metric-band">
            <div class="metric"><div class="metric-value">3/3</div><div class="metric-label">資料就緒</div></div>
            <div class="metric"><div class="metric-value">2</div><div class="metric-label">速度待確認</div></div>
            <div class="metric"><div class="metric-value">8</div><div class="metric-label">越南品項</div></div>
            <div class="metric"><div class="metric-value">3</div><div class="metric-label">台灣品項</div></div>
            <div class="metric"><div class="metric-value">2</div><div class="metric-label">代工品項</div></div>
          </section>
          <section class="control-line"><div>${groupButtons()}</div><div><span class="chip risk">GTP03 速度 0.36–18.39</span> <button class="soft-button">全部檢查完成</button></div></section>
          <section class="mission-grid">
            <aside class="queue" aria-label="今日工作佇列">
              <div class="eyebrow" style="padding:8px">今日工作</div>
              <div class="queue-item"><strong>資料已還原</strong><div class="muted">3 個來源完整</div></div>
              <div class="queue-item"><strong>速度風險</strong><div class="muted">2 個需要理解</div></div>
              <div class="queue-item active"><strong>整理代工訂單</strong><div>2 個品項</div></div>
              <div class="queue-item"><strong>匯出 Excel</strong><div class="muted">三個工作表</div></div>
            </aside>
            <div class="workspace-card"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px"><div><div class="eyebrow">Subcontract order</div><h2 style="margin:4px 0">代工 · 同一家廠商</h2></div><button class="soft-button">＋加入品項</button></div>${orderTable()}${statePanel(variant)}</div>
          </section>
        </main>
      </div>`;
    }

    function renderC(variant) {
      return `<div class="shell variant-c">
        <header class="topbar"><div class="topbar-inner"><div class="brand">Supply</div><div><span class="chip good">已自動保存</span> <button class="primary-button">匯出 Excel</button></div></div></header>
        <main>
          <section class="flow-title"><div class="eyebrow">One clear task at a time</div><h1>一步一步，完成今天的訂單。</h1><p class="muted">畫面只留下現在需要處理的工作；其他區域不會在下方無限延伸。</p></section>
          <nav class="flow-steps" aria-label="工作流程">${['今日','資料','建議','訂單','分析'].map(name => `<button class="flow-step ${state.workspace === name ? 'active' : ''}" data-workspace="${name}">${name}</button>`).join('')}</nav>
          <section class="workspace-card">
            <div class="workspace-head"><div><div class="eyebrow">Step 4 · Order</div><h2 style="font-size:28px;margin:5px 0 0">先完成代工訂單</h2><div class="summary-inline"><span class="chip neutral">2 個品項</span><span class="chip risk">1 個速度風險</span><span class="chip good">覆蓋上限 365 天</span></div></div>${groupButtons()}</div>
            <div style="margin-bottom:14px;padding:14px 16px;border-radius:16px;background:#fff7e8;color:var(--amber)"><strong>GTB03 使用規劃速度 23.23</strong><div style="margin-top:4px;font-size:13px">H10 同一品號出現 0.01 與 23.23；為避免漏下單，採較高可信值。</div></div>
            ${orderTable()}
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:18px"><button class="soft-button">返回建議</button><button class="primary-button">下一步：檢查並匯出</button></div>
            ${statePanel(variant)}
          </section>
        </main>
      </div>`;
    }

    function render() {
      const variant = activeVariant();
      document.getElementById('app').innerHTML = variant.key === 'A' ? renderA(variant) : variant.key === 'B' ? renderB(variant) : renderC(variant);
      document.getElementById('variantLabel').textContent = `${variant.key} — ${variant.name}`;
      document.title = `Supply prototype ${variant.key} — ${variant.name}`;
    }

    function cycle(delta) {
      const current = variants.findIndex(item => item.key === activeVariant().key);
      const next = variants[(current + delta + variants.length) % variants.length];
      const url = new URL(location.href);
      url.searchParams.set('variant', next.key);
      history.replaceState(null, '', url);
      render();
    }

    document.getElementById('previousVariant').addEventListener('click', () => cycle(-1));
    document.getElementById('nextVariant').addEventListener('click', () => cycle(1));
    document.addEventListener('keydown', event => {
      const tag = document.activeElement?.tagName;
      if (['INPUT','TEXTAREA'].includes(tag) || document.activeElement?.isContentEditable) return;
      if (event.key === 'ArrowLeft') cycle(-1);
      if (event.key === 'ArrowRight') cycle(1);
    });
    document.addEventListener('click', event => {
      const workspace = event.target.closest('[data-workspace]')?.dataset.workspace;
      const group = event.target.closest('[data-group]')?.dataset.group;
      if (workspace) state.workspace = workspace;
      if (group) state.orderGroup = group;
      if (workspace || group) render();
    });
    render();
  </script>
</body>
</html>
